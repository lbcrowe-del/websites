name: Deploy Licensing API

on:
  push:
    branches:
      - main
    paths:
      - 'server-bridge/api/**'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet publish server-bridge/api/ServerBridge.LicensingApi.csproj --configuration Release --output ./publish

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # serverbridge-licensing-fc is a Flex Consumption (Linux) app: the runtime stack is set
      # on the app itself (functionAppConfig.runtime = dotnet-isolated 10.0), so the old
      # `az functionapp config set --net-framework-version` step that Windows Consumption
      # needed does not apply and has been removed.
      - name: Deploy to Azure Functions (Flex Consumption)
        uses: Azure/functions-action@v1
        with:
          app-name: serverbridge-licensing-fc
          package: ./publish
