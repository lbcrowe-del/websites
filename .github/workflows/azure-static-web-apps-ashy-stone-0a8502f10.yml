name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      # The PostHog project token is public by design but kept out of git; fill it in here.
      # Without the secret the placeholder stays, and site-analytics.js does nothing.
      - name: Inject PostHog project token
        env:
          PHK: ${{ secrets.POSTHOG_PROJECT_API_KEY }}
        run: |
          if [ -n "$PHK" ]; then
            sed -i "s/__POSTHOG_PROJECT_API_KEY__/$PHK/" server-bridge/js/site-analytics.js
            grep -q "__POSTHOG_PROJECT_API_KEY__" server-bridge/js/site-analytics.js && { echo "::error::token not injected"; exit 1; } || true
          else
            echo "::warning::POSTHOG_PROJECT_API_KEY is not set; website analytics stay off."
          fi
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ASHY_STONE_0A8502F10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "server-bridge" # App source code path
          output_location: "" # Static HTML — no build output directory
          skip_app_build: true # No build step; upload the folder as-is
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ASHY_STONE_0A8502F10 }}
          action: "close"
